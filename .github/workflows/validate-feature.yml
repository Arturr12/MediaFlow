name: Validate MediaFlow feature branch

on:
  push:
    branches:
      - feature/mediaflow-music-playlists
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Preparar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Comprobar sintaxis
        run: python -m compileall -q app.py update_core.py updater.py
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -t . -v
