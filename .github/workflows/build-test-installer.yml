name: Build MediaFlow test installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package"
        required: true
        default: "0.5.0"

permissions:
  contents: read

concurrency:
  group: mediaflow-test-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-installer:
    if: github.ref == 'refs/heads/feature/mediaflow-music-playlists'
    runs-on: windows-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Validar versión
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Versión no válida: $version. Usa el formato X.Y.Z."
          }

      - name: Instalar dependencias de Python
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-build.txt

      - name: Ejecutar pruebas automatizadas
        run: python -m unittest discover -s tests -t . -v

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compilar EXE, instalador y manifiesto
        shell: pwsh
        run: python tools/build_release.py --version "${{ inputs.version }}"

      - name: Publicar instalador como artefacto de prueba
        uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-Test-${{ inputs.version }}
          path: |
            Output/MediaFlow-Setup-${{ inputs.version }}.exe
            Output/mediaflow-update.json
          if-no-files-found: error
          retention-days: 14
